spring.application.name=pidapues

# Lee el mismo archivo .env de la versión anterior (DB_HOST, DB_USER, PIN_ADMIN, GMAIL_USER...).
# Las variables de entorno del sistema también funcionan.
spring.config.import=optional:file:./.env[.properties]

server.port=${PORT:3000}

# --- MySQL (createDatabaseIfNotExist crea la base si no existe) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pidapues}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
# El servidor arranca aunque MySQL esté apagado (el sitio carga pero sin datos y el log dice por qué)
spring.datasource.hikari.initialization-fail-timeout=-1

# --- JPA: las tablas las crea schema.sql, Hibernate no las toca ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jackson.serialization.write-dates-as-timestamps=false
logging.level.org.hibernate.SQL=warn
